name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # cancel superseded runs of the same PR/branch
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # #201: 15 spec legs per PR queue-starve the run past an hour. PRs
  # ride a 6-leg subset covering EVERY OS family (linux amd64+arm64,
  # macos arm64, windows amd64+arm64) plus the 3.0 floor sentinel;
  # the full sweep — in-between ruby minors, intel, the c_main
  # evidence row — runs at the merge (main push), and the release
  # train's published-gem smoke re-proves the shipped matrix.
  spec-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo 'matrix={"include":[{"os":"ubuntu-latest","ruby":"3.4"},{"os":"macos-latest","ruby":"3.4"},{"os":"ubuntu-latest","ruby":"3.0"},{"os":"windows-latest","ruby":"3.3"},{"os":"windows-latest","ruby":"3.4"},{"os":"windows-latest","ruby":"4.0"},{"os":"macos-15-intel","ruby":"3.4"},{"os":"ubuntu-latest","ruby":"3.3"},{"os":"ubuntu-latest","ruby":"4.0"},{"os":"ubuntu-24.04-arm","ruby":"3.4"},{"os":"windows-11-arm","ruby":"3.4"},{"os":"ubuntu-latest","ruby":"3.1"},{"os":"ubuntu-latest","ruby":"3.2"},{"os":"ubuntu-latest","ruby":"3.4","c_main":true}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"os":"ubuntu-latest","ruby":"3.4"},{"os":"macos-latest","ruby":"3.4"},{"os":"ubuntu-latest","ruby":"3.0"},{"os":"windows-latest","ruby":"3.4"},{"os":"ubuntu-24.04-arm","ruby":"3.4"},{"os":"windows-11-arm","ruby":"3.4"}]}' >> "$GITHUB_OUTPUT"
          fi

  spec:
    needs: spec-matrix
    name: Spec on ${{ matrix.os }}${{ matrix.c_main && ' (C main)' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.spec-matrix.outputs.matrix) }}
    continue-on-error: ${{ matrix.c_main == true }}
    steps:
      - name: Checkout binding
        uses: actions/checkout@v4

      # TODO.restructure/40: the C core rides the NEWEST RELEASE TAG —
      # the artifact platform gems vendor. Green-on-C-main proved
      # nothing about the tag (the 0.1.13.5 lesson: the binding suite
      # was green against main while the gem vendored an older tag).
      # A binding PR needing a NEWER C API waits for the C release —
      # enforced ordering, by design.
      - name: Resolve the C core ref
        shell: bash
        run: echo "YEP_C_REF=$(git ls-remote --tags --refs --sort=-v:refname https://github.com/leptris/yeptris.git 'v*' | head -1 | cut -d/ -f3)" >> "$GITHUB_ENV"

      - name: Checkout libyeptris (the C core)
        uses: actions/checkout@v4
        with:
          repository: leptris/yeptris
          path: libyeptris-src
          ref: ${{ matrix.c_main && 'main' || env.YEP_C_REF }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Build shared library (Windows, MSVC default generator)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cmake -B libyeptris-src/build -S libyeptris-src \
            -DYEPTRIS_BUILD_TESTING=OFF \
            -DYEPTRIS_BUILD_CLI=OFF -DYEPTRIS_BUILD_SHARED=ON
          cmake --build libyeptris-src/build --config Release
          DLL="$( (ls libyeptris-src/build/src/Release/*.dll libyeptris-src/build/bin/Release/*.dll 2>/dev/null || true) | head -1)"
          test -n "$DLL"
          cp "$DLL" "$(dirname "$DLL")/libyeptris.dll"
          # the ffi ladder's repo-root candidate (../../libyeptris.dll
          # from lib/yeptris/) — bulletproof against env plumbing
          cp "$DLL" "$GITHUB_WORKSPACE/libyeptris.dll"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Build shared library
        if: runner.os != 'Windows'
        run: |
          cmake -B libyeptris-src/build -S libyeptris-src -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DYEPTRIS_BUILD_TESTING=OFF \
            -DYEPTRIS_BUILD_CLI=OFF -DYEPTRIS_BUILD_SHARED=ON
          cmake --build libyeptris-src/build

      - name: Build the native materializer
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$(uname -s)" = "Darwin" ]; then
            export YEPTRIS_LIB_PATH="$GITHUB_WORKSPACE/libyeptris-src/build/src/libyeptris.dylib"
          elif [ "$(uname -s)" = "Linux" ]; then
            export YEPTRIS_LIB_PATH="$GITHUB_WORKSPACE/libyeptris-src/build/src/libyeptris.so"
          else
            export YEPTRIS_LIB_PATH="$YEPTRIS_LIB"
          fi
          export YEPTRIS_SRC="$GITHUB_WORKSPACE/libyeptris-src/src"
          cd ext/yeptris_native
          ruby extconf.rb && make && \
            { cp native.bundle ../../lib/yeptris/ 2>/dev/null || cp native.so ../../lib/yeptris/; } || \
            echo "::warning::the optional native materializer did not build — the FFI ladder carries the load"

      - name: Run binding specs
        shell: bash
        run: |
          if [ "$(uname -s)" = "Darwin" ]; then
            export YEPTRIS_LIB_PATH="$GITHUB_WORKSPACE/libyeptris-src/build/src/libyeptris.dylib"
          elif [ "$(uname -s)" = "Linux" ]; then
            export YEPTRIS_LIB_PATH="$GITHUB_WORKSPACE/libyeptris-src/build/src/libyeptris.so"
          else
            export YEPTRIS_LIB_PATH="$YEPTRIS_LIB"
          fi
          if [ "$(uname -s)" = "MINGW" ] || [ "$(uname -s)" = "MSYS" ]; then
            export YEP_CHURN_NO_STRESS=1 # DIAG #504: isolate GC.stress as the stall trigger
          fi
          ruby scripts/spec-watchdog.rb

      - name: Save hang evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hang-evidence-${{ matrix.os }}-${{ github.run_id }}
          path: |
            hang-*.dmp
            libyeptris-src/build/src/Release/*.dll
            libyeptris-src/build/src/Release/*.pdb
            libyeptris-src/build/bin/Release/*.dll
            libyeptris-src/build/bin/Release/*.pdb
          if-no-files-found: ignore
          retention-days: 14

  # DIAG #504 round 11: full page heap on ruby.exe. Round 10's double
  # minidump: the main thread frozen (identical RIP/RSP 30s apart) in
  # RtlEnterCriticalSection under ffi_c malloc — a corrupted or orphaned
  # heap lock; the corruption happened EARLIER and surfaces at the next
  # allocation. Page heap turns the corrupting WRITE into an instant AV
  # with the culprit stack (DLL+PDB ride the artifact). No GC.stress
  # (round 10 exonerated it; the hang reproduces without).
  churn-pageheap:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: actions/checkout@v4
        with:
          repository: leptris/yeptris
          path: libyeptris-src
      - name: Build the engine DLL (Release + PDB)
        shell: bash
        run: |
          cmake -B libyeptris-src/build -S libyeptris-src \
            -DYEPTRIS_BUILD_TESTING=OFF \
            -DYEPTRIS_BUILD_CLI=OFF -DYEPTRIS_BUILD_SHARED=ON
          cmake --build libyeptris-src/build --config Release
          DLL="$( (ls libyeptris-src/build/src/Release/*.dll libyeptris-src/build/bin/Release/*.dll 2>/dev/null || true) | head -1)"
          test -n "$DLL"
          cp "$DLL" "$GITHUB_WORKSPACE/libyeptris.dll"
      - name: Enable full page heap for ruby.exe (IFEO)
        shell: pwsh
        run: |
          $k = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\ruby.exe"
          New-Item -Path $k -Force | Out-Null
          Set-ItemProperty -Path $k -Name GlobalFlag -Value 0x02000000 -Type DWord
          Set-ItemProperty -Path $k -Name PageHeapFlags -Value 0x3 -Type DWord
          "page heap armed for ruby.exe"
      - name: Run the churn spec under page heap
        shell: bash
        env:
          YEP_CHURN_NO_STRESS: "1"
        run: |
          export YEPTRIS_LIB_PATH="$GITHUB_WORKSPACE/libyeptris.dll"
          for i in $(seq 1 30); do
            echo "churn round $i"
            bundle exec rspec spec/ownership_churn_spec.rb --format progress || exit 1
          done
      - name: Save hang evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pageheap-evidence-${{ github.run_id }}
          path: |
            hang-*.dmp
            libyeptris-src/build/src/Release/*.dll
            libyeptris-src/build/src/Release/*.pdb
          if-no-files-found: ignore
          retention-days: 14

  # DIAG #504 round 12 — the control cell. The pageheap leg ran 30/30
  # green (no AV, no hang) with: GC.stress off, NO heartbeat thread,
  # page heap on. Known-hanging cells: GC.stress on + no heartbeat
  # (PR #271), GC.stress off + heartbeat (round 10). This leg tests the
  # one untested neighbor: GC.stress off + no heartbeat + NO page heap
  # — isolating whether page heap's allocator layout is what prevents
  # the hang. If green 30x, the mechanism is layout/timing-sensitive
  # heap damage (page heap hides it by construction); if it hangs, the
  # trigger is neither GC.stress nor the heartbeat instrumentation.
  churn-plain:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: actions/checkout@v4
        with:
          repository: leptris/yeptris
          path: libyeptris-src
      - name: Build the engine DLL (Release + PDB)
        shell: bash
        run: |
          cmake -B libyeptris-src/build -S libyeptris-src \
            -DYEPTRIS_BUILD_TESTING=OFF \
            -DYEPTRIS_BUILD_CLI=OFF -DYEPTRIS_BUILD_SHARED=ON
          cmake --build libyeptris-src/build --config Release
          DLL="$( (ls libyeptris-src/build/src/Release/*.dll libyeptris-src/build/bin/Release/*.dll 2>/dev/null || true) | head -1)"
          test -n "$DLL"
          cp "$DLL" "$GITHUB_WORKSPACE/libyeptris.dll"
      - name: Run the churn spec plain, 30x (no page heap, no heartbeat)
        shell: bash
        env:
          YEP_CHURN_NO_STRESS: "1"
        run: |
          export YEPTRIS_LIB_PATH="$GITHUB_WORKSPACE/libyeptris.dll"
          for i in $(seq 1 30); do
            echo "churn round $i"
            timeout 300 bundle exec rspec spec/ownership_churn_spec.rb --format progress || exit 1
          done

  # DIAG #504 round 13 — the two discriminator cells. Known matrix:
  #   full suite + watchdog + heartbeat + GC.stress ON  -> hang (rounds 5-9, PR #271)
  #   full suite + watchdog + heartbeat + GC.stress OFF -> hang (round 10)
  #   churn only + no instr + GC.stress OFF, page heap   -> green 30x
  #   churn only + no instr + GC.stress OFF, plain heap  -> green 30x (control)
  # Remaining variables between the hanging and green cells: the
  # heartbeat thread, the watchdog Open3 wrapper, and the full-suite
  # context (specs preceding the churn spec). These legs split them.
  churn-heartbeat:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: actions/checkout@v4
        with:
          repository: leptris/yeptris
          path: libyeptris-src
      - name: Build the engine DLL (Release + PDB)
        shell: bash
        run: |
          cmake -B libyeptris-src/build -S libyeptris-src \
            -DYEPTRIS_BUILD_TESTING=OFF \
            -DYEPTRIS_BUILD_CLI=OFF -DYEPTRIS_BUILD_SHARED=ON
          cmake --build libyeptris-src/build --config Release
          DLL="$( (ls libyeptris-src/build/src/Release/*.dll libyeptris-src/build/bin/Release/*.dll 2>/dev/null || true) | head -1)"
          test -n "$DLL"
          cp "$DLL" "$GITHUB_WORKSPACE/libyeptris.dll"
      - name: Churn spec 30x with the heartbeat thread (no watchdog)
        shell: bash
        env:
          YEP_CHURN_NO_STRESS: "1"
        run: |
          export YEPTRIS_LIB_PATH="$GITHUB_WORKSPACE/libyeptris.dll"
          for i in $(seq 1 30); do
            echo "churn round $i"
            timeout 300 bundle exec rspec spec/ownership_churn_spec.rb --format progress -r ./scripts/spec-heartbeat.rb || exit 1
          done
  suite-plain:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: actions/checkout@v4
        with:
          repository: leptris/yeptris
          path: libyeptris-src
      - name: Build the engine DLL (Release + PDB)
        shell: bash
        run: |
          cmake -B libyeptris-src/build -S libyeptris-src \
            -DYEPTRIS_BUILD_TESTING=OFF \
            -DYEPTRIS_BUILD_CLI=OFF -DYEPTRIS_BUILD_SHARED=ON
          cmake --build libyeptris-src/build --config Release
          DLL="$( (ls libyeptris-src/build/src/Release/*.dll libyeptris-src/build/bin/Release/*.dll 2>/dev/null || true) | head -1)"
          test -n "$DLL"
          cp "$DLL" "$GITHUB_WORKSPACE/libyeptris.dll"
      - name: Full suite 3x, no heartbeat, no watchdog (GC.stress off)
        shell: bash
        env:
          YEP_CHURN_NO_STRESS: "1"
        run: |
          export YEPTRIS_LIB_PATH="$GITHUB_WORKSPACE/libyeptris.dll"
          for i in 1 2 3; do
            echo "suite round $i"
            timeout 1200 bundle exec rspec --format progress || exit 1
          done

  # DIAG #504 round 14 — the last discriminator cell. Matrix so far:
  #   full suite + watchdog + heartbeat (stress off)      -> HANG (round 10)
  #   churn only + heartbeat (stress off)                 -> green 30x
  #   full suite + no instr (stress off)                  -> no hang (2 spec
  #     failures: chevron (fixed by #274+#536) + the known windows
  #     Ractor flake; but only ~1 round completed)
  # This leg: full suite + heartbeat, no watchdog — does the COMBINATION
  # reproduce the hang? If yes, the delta vs churn-heartbeat is the
  # preceding specs' process state; if no, the watchdog Open3 wrapper
  # joins the recipe.
  suite-heartbeat:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: actions/checkout@v4
        with:
          repository: leptris/yeptris
          path: libyeptris-src
      - name: Build the engine DLL (Release + PDB)
        shell: bash
        run: |
          cmake -B libyeptris-src/build -S libyeptris-src \
            -DYEPTRIS_BUILD_TESTING=OFF \
            -DYEPTRIS_BUILD_CLI=OFF -DYEPTRIS_BUILD_SHARED=ON
          cmake --build libyeptris-src/build --config Release
          DLL="$( (ls libyeptris-src/build/src/Release/*.dll libyeptris-src/build/bin/Release/*.dll 2>/dev/null || true) | head -1)"
          test -n "$DLL"
          cp "$DLL" "$GITHUB_WORKSPACE/libyeptris.dll"
      - name: Full suite 3x with the heartbeat thread (no watchdog)
        shell: bash
        env:
          YEP_CHURN_NO_STRESS: "1"
        run: |
          export YEPTRIS_LIB_PATH="$GITHUB_WORKSPACE/libyeptris.dll"
          for i in 1 2 3; do
            echo "suite round $i"
            timeout 1200 bundle exec rspec --format progress -r ./scripts/spec-heartbeat.rb || exit 1
          done

  # TODO.restructure/34/36: the JSON comparison profile — the referee.
  # Modes run in SEPARATE processes (env at load); the table prints on
  # every CI run. The gate threshold comes from the evidence and is
  # enforced on the BEST mode below.
  # The referee (TODO.restructure/36): the per-arch DEFAULT must beat
  # JSON.parse on both platforms (GATE=1.00); off-default combos run
  # ungated as evidence.
  # #201: the profile legs exist to gate engine/binding changes —
  # docs- and psych-port-only PRs skip them (~40% of profile leg-time).
  # Always on main pushes (the referee archive), path-gated on PRs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.f.outputs.engine }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            engine:
              - 'ext/**'
              - 'vendor/**'
              - 'lib/yeptris/json.rb'
              - 'lib/yeptris/cbor.rb'
              - 'lib/yeptris/native*'
              - 'lib/yeptris/ffi.rb'
              - 'spec/**'
              - '.github/workflows/ci.yml'

  json-profile:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.engine == 'true'
    name: JSON profile (${{ matrix.os }}, ${{ matrix.gc_mode }}/${{ matrix.ins_mode }}${{ matrix.gated && ', GATE' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # include-ONLY: top-level keys would make the entries MERGE
        # into base combos instead of adding rows (measured: 2 of 5
        # jobs ran). ruby rides every row.
        include:
          # per-arch defaults (TODO.restructure/35): x86_64-linux ->
          # disable; darwin/arm64 -> none. GATED at 1.05.
          - os: ubuntu-latest
            ruby: "3.4"
            gc_mode: disable
            ins_mode: bulk
            # Re-baselined 2026-09-13 (issue #74 investigation): the
            # runner image's stdlib JSON.parse got faster; yeptris
            # JSON.load measures ~1.10-1.14x mean on ubuntu (the same
            # build was <1.00 on the prior image; the ungated leg
            # measured 1.135x while the gated leg passed in the SAME
            # run — the runner population is bimodal around the line).
            # 1.20 holds the no-regression line; restore 1.00 when the
            # JSON tape route (yeptris#85) reaches the Ruby path.
            gate: "1.20"
            gated: true
          - os: macos-latest
            ruby: "3.4"
            gc_mode: none
            ins_mode: bulk
            gated: true
          # off-default evidence rows (ungated)
          - os: ubuntu-latest
            ruby: "3.4"
            gc_mode: none
            ins_mode: bulk
            gated: false
          - os: macos-latest
            ruby: "3.4"
            gc_mode: disable
            ins_mode: bulk
            gated: false
          - os: ubuntu-latest
            ruby: "3.4"
            gc_mode: disable
            ins_mode: aset
            gated: false
          # shape rows (TODO.restructure/39): embedded small arrays
          # + exact-capacity hashes vs capa(8)-up-front
          - os: ubuntu-latest
            ruby: "3.4"
            gc_mode: disable
            ins_mode: bulk
            shape_mode: natural
            gated: false
          - os: macos-latest
            ruby: "3.4"
            gc_mode: none
            ins_mode: bulk
            shape_mode: natural
            gated: false
    steps:
      - name: Checkout binding
        uses: actions/checkout@v4

      # same tag pin as the spec job: the referee measures the C lib
      # users get (TODO.restructure/40)
      - name: Resolve the C core ref
        shell: bash
        run: echo "YEP_C_REF=$(git ls-remote --tags --refs --sort=-v:refname https://github.com/leptris/yeptris.git 'v*' | head -1 | cut -d/ -f3)" >> "$GITHUB_ENV"

      - name: Checkout libyeptris (the C core)
        uses: actions/checkout@v4
        with:
          repository: leptris/yeptris
          path: libyeptris-src
          ref: ${{ env.YEP_C_REF }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Build shared library (Windows, MSVC default generator)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cmake -B libyeptris-src/build -S libyeptris-src \
            -DYEPTRIS_BUILD_TESTING=OFF \
            -DYEPTRIS_BUILD_CLI=OFF -DYEPTRIS_BUILD_SHARED=ON
          cmake --build libyeptris-src/build --config Release
          DLL="$( (ls libyeptris-src/build/src/Release/*.dll libyeptris-src/build/bin/Release/*.dll 2>/dev/null || true) | head -1)"
          test -n "$DLL"
          cp "$DLL" "$(dirname "$DLL")/libyeptris.dll"
          # the ffi ladder's repo-root candidate (../../libyeptris.dll
          # from lib/yeptris/) — bulletproof against env plumbing
          cp "$DLL" "$GITHUB_WORKSPACE/libyeptris.dll"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Build shared library and native extension
        run: |
          cmake -B libyeptris-src/build -S libyeptris-src -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DYEPTRIS_BUILD_TESTING=OFF \
            -DYEPTRIS_BUILD_CLI=OFF -DYEPTRIS_BUILD_SHARED=ON
          cmake --build libyeptris-src/build
          if [ "$(uname -s)" = "Darwin" ]; then
            export YEPTRIS_LIB_PATH="$GITHUB_WORKSPACE/libyeptris-src/build/src/libyeptris.dylib"
          else
            export YEPTRIS_LIB_PATH="$GITHUB_WORKSPACE/libyeptris-src/build/src/libyeptris.so"
          fi
          export YEPTRIS_SRC="$GITHUB_WORKSPACE/libyeptris-src/src"
          cd ext/yeptris_native
          ruby extconf.rb && make && \
            { cp native.bundle ../../lib/yeptris/ 2>/dev/null || cp native.so ../../lib/yeptris/; } || \
            echo "::warning::the optional native materializer did not build — the FFI ladder carries the load"

      - name: Run the profile
        run: |
          if [ "$(uname -s)" = "Darwin" ]; then
            export YEPTRIS_LIB_PATH="$GITHUB_WORKSPACE/libyeptris-src/build/src/libyeptris.dylib"
          else
            export YEPTRIS_LIB_PATH="$GITHUB_WORKSPACE/libyeptris-src/build/src/libyeptris.so"
          fi
          export YEPTRIS_NATIVE_GC="${{ matrix.gc_mode }}"
          export YEPTRIS_NATIVE_INSERT="${{ matrix.ins_mode }}"
          export YEPTRIS_NATIVE_CACHE="${{ matrix.cache_mode || 'on' }}"
          export YEPTRIS_NATIVE_SHAPE="${{ matrix.shape_mode || 'pre' }}"
          export GATE="${{ matrix.gate || (matrix.gated && '1.00') || '' }}"
          bundle exec ruby benchmark/json_profile.rb 200

  # The CBOR referee (#157): interleaved A/B vs the cbor gem on a
  # CI-fresh runner — the honest venue (dev-host isolated numbers are
  # thermal fiction; the 2026-09-19 (ii) ledger entry).
  cbor-profile:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.engine == 'true'
    name: CBOR profile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the C core ref
        shell: bash
        run: echo "YEP_C_REF=$(git ls-remote --tags --refs --sort=-v:refname https://github.com/leptris/yeptris.git 'v*' | head -1 | cut -d/ -f3)" >> "$GITHUB_ENV"

      - name: Checkout libyeptris (the C core)
        uses: actions/checkout@v4
        with:
          repository: leptris/yeptris
          path: libyeptris-src
          ref: ${{ env.YEP_C_REF }}

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Run the profile
        run: |
          cmake -B libyeptris-src/build -S libyeptris-src -G Ninja             -DCMAKE_BUILD_TYPE=Release -DYEPTRIS_BUILD_TESTING=OFF             -DYEPTRIS_BUILD_CLI=OFF -DYEPTRIS_BUILD_SHARED=ON
          cmake --build libyeptris-src/build
          if [ "$(uname -s)" = "Darwin" ]; then
            export YEPTRIS_LIB_PATH="$GITHUB_WORKSPACE/libyeptris-src/build/src/libyeptris.dylib"
          else
            export YEPTRIS_LIB_PATH="$GITHUB_WORKSPACE/libyeptris-src/build/src/libyeptris.so"
          fi
          export YEPTRIS_SRC="$GITHUB_WORKSPACE/libyeptris-src/src"
          cd ext/yeptris_native
          ruby extconf.rb && make && \
            { cp native.bundle ../../lib/yeptris/ 2>/dev/null || cp native.so ../../lib/yeptris/; } || \
            echo "::warning::the optional native materializer did not build — the FFI ladder carries the load"
          cd "$GITHUB_WORKSPACE"
          bundle exec ruby benchmark/cbor_profile.rb 200

  # The pinned-check trap: branch protection requires two JSON profile
  # legs BY NAME; a matrix job skipped by the #201 path gate reports
  # only the unexpanded template name, so those contexts sit "expected"
  # forever and the PR can never merge (admin override cannot bypass a
  # check that never reported). These two placeholder legs satisfy the
  # pinned contexts in seconds on non-engine PRs; they are skipped
  # whenever the real profiles run, so no name reports twice.
  profiles-required:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.engine != 'true'
    name: JSON profile (${{ matrix.os }}, ${{ matrix.gc_mode }}/${{ matrix.ins_mode }}${{ matrix.gated && ', GATE' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            gc_mode: disable
            ins_mode: bulk
            gated: true
          - os: macos-latest
            gc_mode: none
            ins_mode: bulk
            gated: true
    steps:
      - name: Non-engine PR — profiles skipped by the path gate
        run: echo "placeholder — satisfies the pinned required checks"
