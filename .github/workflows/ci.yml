name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  spec:
    name: Spec on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ruby: ["3.4"]
    steps:
      - name: Checkout binding
        uses: actions/checkout@v4

      - name: Checkout libyeptris (the C core)
        uses: actions/checkout@v4
        with:
          repository: leptris/yeptris
          path: libyeptris-src

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Build shared library
        run: |
          cmake -B libyeptris-src/build -S libyeptris-src -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DYEPTRIS_BUILD_TESTING=OFF \
            -DYEPTRIS_BUILD_CLI=OFF -DYEPTRIS_BUILD_SHARED=ON
          cmake --build libyeptris-src/build

      - name: Build the native materializer
        run: |
          if [ "$(uname -s)" = "Darwin" ]; then
            export YEPTRIS_LIB_PATH="$GITHUB_WORKSPACE/libyeptris-src/build/src/libyeptris.dylib"
          else
            export YEPTRIS_LIB_PATH="$GITHUB_WORKSPACE/libyeptris-src/build/src/libyeptris.so"
          fi
          export YEPTRIS_SRC="$GITHUB_WORKSPACE/libyeptris-src/src"
          cd ext/yeptris_native
          ruby extconf.rb
          make
          cp native.bundle ../../lib/yeptris/ 2>/dev/null || cp native.so ../../lib/yeptris/

      - name: Run binding specs
        run: |
          if [ "$(uname -s)" = "Darwin" ]; then
            export YEPTRIS_LIB_PATH="$GITHUB_WORKSPACE/libyeptris-src/build/src/libyeptris.dylib"
          else
            export YEPTRIS_LIB_PATH="$GITHUB_WORKSPACE/libyeptris-src/build/src/libyeptris.so"
          fi
          bundle exec rspec

  # TODO.restructure/34/36: the JSON comparison profile — the referee.
  # Modes run in SEPARATE processes (env at load); the table prints on
  # every CI run. The gate threshold comes from the evidence and is
  # enforced on the BEST mode below.
  json-profile:
    name: JSON profile (${{ matrix.os }}, ${{ matrix.gc_mode }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        gc_mode: [disable, none]
        ins_mode: [bulk, aset]
        ruby: ["3.4"]
        exclude:
          # the shipped default combination runs on both platforms;
          # the off-default gc modes only need one insert strategy
          - gc_mode: disable
            ins_mode: aset
          - gc_mode: none
            ins_mode: bulk
    steps:
      - name: Checkout binding
        uses: actions/checkout@v4

      - name: Checkout libyeptris (the C core)
        uses: actions/checkout@v4
        with:
          repository: leptris/yeptris
          path: libyeptris-src

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Build shared library and native extension
        run: |
          cmake -B libyeptris-src/build -S libyeptris-src -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DYEPTRIS_BUILD_TESTING=OFF \
            -DYEPTRIS_BUILD_CLI=OFF -DYEPTRIS_BUILD_SHARED=ON
          cmake --build libyeptris-src/build
          if [ "$(uname -s)" = "Darwin" ]; then
            export YEPTRIS_LIB_PATH="$GITHUB_WORKSPACE/libyeptris-src/build/src/libyeptris.dylib"
          else
            export YEPTRIS_LIB_PATH="$GITHUB_WORKSPACE/libyeptris-src/build/src/libyeptris.so"
          fi
          export YEPTRIS_SRC="$GITHUB_WORKSPACE/libyeptris-src/src"
          cd ext/yeptris_native
          ruby extconf.rb
          make
          cp native.bundle ../../lib/yeptris/ 2>/dev/null || cp native.so ../../lib/yeptris/

      - name: Run the profile
        run: |
          if [ "$(uname -s)" = "Darwin" ]; then
            export YEPTRIS_LIB_PATH="$GITHUB_WORKSPACE/libyeptris-src/build/src/libyeptris.dylib"
          else
            export YEPTRIS_LIB_PATH="$GITHUB_WORKSPACE/libyeptris-src/build/src/libyeptris.so"
          fi
          export YEPTRIS_NATIVE_GC="${{ matrix.gc_mode }}"
          export YEPTRIS_NATIVE_INSERT="${{ matrix.ins_mode }}"
          bundle exec ruby benchmark/json_profile.rb 200
