name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  spec:
    name: Spec on ${{ matrix.os }}${{ matrix.c_main && ' (C main)' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # include-ONLY (top-level keys would MERGE rows); ruby rides
        # every row. c_main: the optional evidence row against the
        # C repo's default branch — non-blocking, the C repo's own
        # CI gates main.
        include:
          - os: ubuntu-latest
            ruby: "3.4"
          - os: macos-latest
            ruby: "3.4"
          - os: ubuntu-latest
            ruby: "3.4"
            c_main: true
    continue-on-error: ${{ matrix.c_main == true }}
    steps:
      - name: Checkout binding
        uses: actions/checkout@v4

      # TODO.restructure/40: the C core rides the NEWEST RELEASE TAG —
      # the artifact platform gems vendor. Green-on-C-main proved
      # nothing about the tag (the 0.1.13.5 lesson: the binding suite
      # was green against main while the gem vendored an older tag).
      # A binding PR needing a NEWER C API waits for the C release —
      # enforced ordering, by design.
      - name: Resolve the C core ref
        run: echo "YEP_C_REF=$(git ls-remote --tags --refs --sort=-v:refname https://github.com/leptris/yeptris.git 'v*' | head -1 | cut -d/ -f3)" >> "$GITHUB_ENV"

      - name: Checkout libyeptris (the C core)
        uses: actions/checkout@v4
        with:
          repository: leptris/yeptris
          path: libyeptris-src
          ref: ${{ matrix.c_main && 'main' || env.YEP_C_REF }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Build shared library
        run: |
          cmake -B libyeptris-src/build -S libyeptris-src -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DYEPTRIS_BUILD_TESTING=OFF \
            -DYEPTRIS_BUILD_CLI=OFF -DYEPTRIS_BUILD_SHARED=ON
          cmake --build libyeptris-src/build

      - name: Build the native materializer
        run: |
          if [ "$(uname -s)" = "Darwin" ]; then
            export YEPTRIS_LIB_PATH="$GITHUB_WORKSPACE/libyeptris-src/build/src/libyeptris.dylib"
          else
            export YEPTRIS_LIB_PATH="$GITHUB_WORKSPACE/libyeptris-src/build/src/libyeptris.so"
          fi
          export YEPTRIS_SRC="$GITHUB_WORKSPACE/libyeptris-src/src"
          cd ext/yeptris_native
          ruby extconf.rb
          make
          cp native.bundle ../../lib/yeptris/ 2>/dev/null || cp native.so ../../lib/yeptris/

      - name: Run binding specs
        run: |
          if [ "$(uname -s)" = "Darwin" ]; then
            export YEPTRIS_LIB_PATH="$GITHUB_WORKSPACE/libyeptris-src/build/src/libyeptris.dylib"
          else
            export YEPTRIS_LIB_PATH="$GITHUB_WORKSPACE/libyeptris-src/build/src/libyeptris.so"
          fi
          bundle exec rspec

  # TODO.restructure/34/36: the JSON comparison profile — the referee.
  # Modes run in SEPARATE processes (env at load); the table prints on
  # every CI run. The gate threshold comes from the evidence and is
  # enforced on the BEST mode below.
  # The referee (TODO.restructure/36): the per-arch DEFAULT must beat
  # JSON.parse on both platforms (GATE=1.00); off-default combos run
  # ungated as evidence.
  json-profile:
    name: JSON profile (${{ matrix.os }}, ${{ matrix.gc_mode }}/${{ matrix.ins_mode }}${{ matrix.gated && ', GATE' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # include-ONLY: top-level keys would make the entries MERGE
        # into base combos instead of adding rows (measured: 2 of 5
        # jobs ran). ruby rides every row.
        include:
          # per-arch defaults (TODO.restructure/35): x86_64-linux ->
          # disable; darwin/arm64 -> none. GATED at 1.05.
          - os: ubuntu-latest
            ruby: "3.4"
            gc_mode: disable
            ins_mode: bulk
            gated: true
          - os: macos-latest
            ruby: "3.4"
            gc_mode: none
            ins_mode: bulk
            gated: true
          # off-default evidence rows (ungated)
          - os: ubuntu-latest
            ruby: "3.4"
            gc_mode: none
            ins_mode: bulk
            gated: false
          - os: macos-latest
            ruby: "3.4"
            gc_mode: disable
            ins_mode: bulk
            gated: false
          - os: ubuntu-latest
            ruby: "3.4"
            gc_mode: disable
            ins_mode: aset
            gated: false
          # shape rows (TODO.restructure/39): embedded small arrays
          # + exact-capacity hashes vs capa(8)-up-front
          - os: ubuntu-latest
            ruby: "3.4"
            gc_mode: disable
            ins_mode: bulk
            shape_mode: natural
            gated: false
          - os: macos-latest
            ruby: "3.4"
            gc_mode: none
            ins_mode: bulk
            shape_mode: natural
            gated: false
    steps:
      - name: Checkout binding
        uses: actions/checkout@v4

      # same tag pin as the spec job: the referee measures the C lib
      # users get (TODO.restructure/40)
      - name: Resolve the C core ref
        run: echo "YEP_C_REF=$(git ls-remote --tags --refs --sort=-v:refname https://github.com/leptris/yeptris.git 'v*' | head -1 | cut -d/ -f3)" >> "$GITHUB_ENV"

      - name: Checkout libyeptris (the C core)
        uses: actions/checkout@v4
        with:
          repository: leptris/yeptris
          path: libyeptris-src
          ref: ${{ env.YEP_C_REF }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Build shared library and native extension
        run: |
          cmake -B libyeptris-src/build -S libyeptris-src -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DYEPTRIS_BUILD_TESTING=OFF \
            -DYEPTRIS_BUILD_CLI=OFF -DYEPTRIS_BUILD_SHARED=ON
          cmake --build libyeptris-src/build
          if [ "$(uname -s)" = "Darwin" ]; then
            export YEPTRIS_LIB_PATH="$GITHUB_WORKSPACE/libyeptris-src/build/src/libyeptris.dylib"
          else
            export YEPTRIS_LIB_PATH="$GITHUB_WORKSPACE/libyeptris-src/build/src/libyeptris.so"
          fi
          export YEPTRIS_SRC="$GITHUB_WORKSPACE/libyeptris-src/src"
          cd ext/yeptris_native
          ruby extconf.rb
          make
          cp native.bundle ../../lib/yeptris/ 2>/dev/null || cp native.so ../../lib/yeptris/

      - name: Run the profile
        run: |
          if [ "$(uname -s)" = "Darwin" ]; then
            export YEPTRIS_LIB_PATH="$GITHUB_WORKSPACE/libyeptris-src/build/src/libyeptris.dylib"
          else
            export YEPTRIS_LIB_PATH="$GITHUB_WORKSPACE/libyeptris-src/build/src/libyeptris.so"
          fi
          export YEPTRIS_NATIVE_GC="${{ matrix.gc_mode }}"
          export YEPTRIS_NATIVE_INSERT="${{ matrix.ins_mode }}"
          export YEPTRIS_NATIVE_CACHE="${{ matrix.cache_mode || 'on' }}"
          export YEPTRIS_NATIVE_SHAPE="${{ matrix.shape_mode || 'pre' }}"
          export GATE="${{ matrix.gated && '1.00' || '' }}"
          bundle exec ruby benchmark/json_profile.rb 200
